# MagicBot Z1 12DOF — 5-Stage Locomotion Training Plan
# =====================================================
# Usage:
#   python -m automation.orchestrator --plan training_plans/z1_5stage_plan.yaml
#   python -m automation.orchestrator --plan training_plans/z1_5stage_plan.yaml --start-from s4_rough_l1

stages:
  - id: s1_flat
    terrain: flat
    env_config: configs/velocity_env_cfg_s1_flat.py
    max_iterations: 10000
    num_envs: 4096
    monitor:
      action_rate_threshold: -0.8
      min_iterations: 2000

  - id: s2_flat
    terrain: flat
    env_config: configs/velocity_env_cfg_s2_flat.py
    max_iterations: 25000
    num_envs: 4096
    resume_from: s1_flat

  - id: s3_gentle
    terrain: gentle
    env_config: configs/velocity_env_cfg_s3_gentle.py
    max_iterations: 25000
    num_envs: 4096
    resume_from: s2_flat

  - id: s4_rough_l1
    terrain: rough
    env_config: configs/velocity_env_cfg_s4_rough_l1.py
    max_iterations: 40000
    num_envs: 4096
    resume_from: s3_gentle

  - id: s4_full_terrain
    terrain: rough
    env_config: configs/velocity_env_cfg_s4_full_terrain.py
    max_iterations: 50000
    num_envs: 4096
    resume_from: s4_rough_l1

  - id: s5_full
    terrain: rough
    env_config: configs/velocity_env_cfg_s5_full.py
    max_iterations: 50000
    num_envs: 4096
    resume_from: s4_full_terrain

retry_policy:
  max_retries: 2
  nan:
    learning_rate_multiplier: 0.5
  oom:
    num_envs_divisor: 2
