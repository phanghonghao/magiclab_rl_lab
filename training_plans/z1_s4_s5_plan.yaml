# Z1 s4→s5 训练计划
# s4_rough_l1 (v6) 已完成, 从其 best checkpoint 继续
# min_iterations 是相对值: resume 后 2000 iter 才开始过拟合检测

stages:
  - id: s4_full_terrain
    terrain: rough
    env_config: source/magiclab_rl_lab/magiclab_rl_lab/tasks/locomotion/robots/z1/12dof/velocity_env_cfg_s7_rough_full.py
    max_iterations: 50000
    num_envs: 4096
    initial_checkpoint: /home/phh/magiclab_rl_lab/logs/rsl_rl/magiclab_z1_12dof_velocity/2026-05-04_12-40-26_s6_l1_action_rate_4gpu/model_5000.pt
    monitor:
      action_rate_threshold: -1.5
      min_iterations: 2000

retry_policy:
  max_retries: 2
  nan:
    learning_rate_multiplier: 0.5
  oom:
    num_envs_divisor: 2
